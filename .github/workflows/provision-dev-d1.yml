name: provision-dev-d1

on:
  push:
    branches:
      - agent/bootstrap-baseline
    paths:
      - .provision-dev-d1-trigger

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: choosepc-dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bootstrap-baseline
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 2; }
      - run: npm ci
      - name: Reuse or create development D1 and bind DB
        run: |
          npx wrangler d1 list --json > /tmp/d1-list.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const dbs = Array.isArray(raw) ? raw : (raw.result ?? raw.databases ?? []);
          const target = dbs.find((db) => db?.name === process.env.D1_NAME);
          if (!target) process.exit(3);
          const id = target.uuid ?? target.id ?? target.database_id;
          if (!id) throw new Error('Existing D1 record did not expose an id');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases = [{ binding: 'DB', database_name: process.env.D1_NAME, database_id: id }];
          fs.writeFileSync('wrangler.jsonc', `${JSON.stringify(config, null, 2)}\n`);
          fs.writeFileSync('/tmp/d1-id.txt', String(id));
          NODE
          status=$?
          if [ "$status" -eq 3 ]; then
            npx wrangler d1 create "$D1_NAME" --location apac --binding DB --update-config
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
            const db = (config.d1_databases ?? []).find((entry) => entry.binding === 'DB');
            if (!db?.database_id) throw new Error('Wrangler did not write the DB binding');
            fs.writeFileSync('/tmp/d1-id.txt', String(db.database_id));
            NODE
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Validate binding before remote writes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const rows = config.d1_databases ?? [];
          if (rows.length !== 1) throw new Error(`Expected exactly one D1 binding, got ${rows.length}`);
          const db = rows[0];
          if (db.binding !== 'DB' || db.database_name !== process.env.D1_NAME || !db.database_id) {
            throw new Error('Invalid DB binding');
          }
          NODE
      - name: Apply repository migrations to development D1
        run: npx wrangler d1 migrations apply DB --remote
      - name: Generate and apply versioned knowledge seed
        run: |
          node scripts/build_knowledge_seed.mjs --git-sha "$(git rev-parse HEAD)" --output /tmp/choosepc-knowledge-seed.sql
          npx wrangler d1 execute DB --remote --file=/tmp/choosepc-knowledge-seed.sql --yes
      - name: Verify foreign keys and seeded catalog counts
        run: |
          npx wrangler d1 execute DB --remote --command="PRAGMA foreign_key_check;" --json > /tmp/fk.json
          npx wrangler d1 execute DB --remote --command="SELECT (SELECT COUNT(*) FROM hardware_cpu) AS cpu_count, (SELECT COUNT(*) FROM hardware_gpu) AS gpu_count, (SELECT COUNT(*) FROM source_documents) AS source_count;" --json > /tmp/counts.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function results(path) {
            const raw = JSON.parse(fs.readFileSync(path, 'utf8'));
            const blocks = Array.isArray(raw) ? raw : [raw];
            return blocks.flatMap((block) => block?.results ?? block?.result?.results ?? []);
          }
          const fk = results('/tmp/fk.json');
          if (fk.length !== 0) throw new Error(`Foreign-key violations: ${JSON.stringify(fk)}`);
          const counts = results('/tmp/counts.json')[0];
          if (!counts) throw new Error('Missing seed verification row');
          if (Number(counts.cpu_count) < 8 || Number(counts.gpu_count) < 9 || Number(counts.source_count) < 3) {
            throw new Error(`Seed counts below expected minimum: ${JSON.stringify(counts)}`);
          }
          const report = {
            databaseName: process.env.D1_NAME,
            databaseId: fs.readFileSync('/tmp/d1-id.txt', 'utf8').trim(),
            foreignKeyViolations: fk.length,
            cpuCount: Number(counts.cpu_count),
            gpuCount: Number(counts.gpu_count),
            sourceCount: Number(counts.source_count),
            verifiedAt: new Date().toISOString(),
          };
          fs.writeFileSync('/tmp/d1-provision-report.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report));
          NODE
      - name: Commit D1 binding if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          if git diff --cached --quiet; then
            echo "D1 binding already current"
            exit 0
          fi
          git commit -m "chore: bind development D1 database"
          git push origin HEAD:agent/bootstrap-baseline
      - name: Upload provisioning report
        uses: actions/upload-artifact@v4
        with:
          name: choosepc-dev-d1-provision
          path: /tmp/d1-provision-report.json
          if-no-files-found: error
          retention-days: 14
