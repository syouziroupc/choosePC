name: sync-cloudflare-production

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: choosepc-cloudflare-production-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UI_URL: https://www.szpc.jp/pc-check/
      HEALTH_URL: https://www.szpc.jp/api/v1/health
      CATALOG_URL: https://www.szpc.jp/api/v1/catalog
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check that this is still the newest main CI result
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest_main="$(git rev-parse origin/main)"
          if [ "$latest_main" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; this completed CI run will not be promoted."
          fi

      - name: Move validated production branch
        if: steps.freshness.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cloudflare-production || true
          git push origin HEAD:refs/heads/cloudflare-production --force-with-lease
          remote_sha="$(git ls-remote origin refs/heads/cloudflare-production | awk '{print $1}')"
          if [ "$remote_sha" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "cloudflare-production did not move to the validated main SHA"
            exit 1
          fi

      - name: Resolve exact expected production markers
        if: steps.freshness.outputs.promote == 'true'
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const source = fs.readFileSync('apps/worker/src/browser-enhanced-entry.ts', 'utf8');
          const revision = source.match(/export const UI_REVISION = "([^"]+)";/)?.[1];
          if (!revision) throw new Error('UI_REVISION was not found');
          function countJsonEntries(dir) {
            return fs.readdirSync(dir)
              .filter((name) => name.endsWith('.json'))
              .reduce((sum, name) => {
                const value = JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
                return sum + (Array.isArray(value) ? value.length : 1);
              }, 0);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `ui_revision=${revision}\ncpu_count=${countJsonEntries('knowledge/hardware/cpu')}\ngpu_count=${countJsonEntries('knowledge/hardware/gpu')}\n`);
          NODE

      - name: Verify Cloudflare production converges to this exact source
        if: steps.freshness.outputs.promote == 'true'
        shell: bash
        env:
          REQUIRED_UI_REVISION: ${{ steps.expected.outputs.ui_revision }}
          REQUIRED_CPU_COUNT: ${{ steps.expected.outputs.cpu_count }}
          REQUIRED_GPU_COUNT: ${{ steps.expected.outputs.gpu_count }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            html="$(curl --fail --silent --show-error --location --max-time 10 -H 'Cache-Control: no-cache' "${UI_URL}?smoke=${GITHUB_SHA}" || true)"
            health="$(curl --fail --silent --show-error --location --max-time 10 -H 'Cache-Control: no-cache' "${HEALTH_URL}?smoke=${GITHUB_SHA}" || true)"
            catalog="$(curl --fail --silent --show-error --location --max-time 10 -H 'Cache-Control: no-cache' "${CATALOG_URL}?smoke=${GITHUB_SHA}" || true)"

            catalog_ok=0
            if [ -n "$catalog" ]; then
              printf '%s' "$catalog" > /tmp/catalog.json
              if REQUIRED_CPU_COUNT="$REQUIRED_CPU_COUNT" REQUIRED_GPU_COUNT="$REQUIRED_GPU_COUNT" node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/catalog.json', 'utf8'));
          const cpu = Array.isArray(data.cpus) ? data.cpus.length : -1;
          const gpu = Array.isArray(data.gpus) ? data.gpus.length : -1;
          if (cpu !== Number(process.env.REQUIRED_CPU_COUNT) || gpu !== Number(process.env.REQUIRED_GPU_COUNT)) process.exit(1);
          NODE
              then
                catalog_ok=1
              fi
            fi

            if printf '%s' "$html" | grep -q 'このパソコン、買って大丈夫？' \
              && printf '%s' "$html" | grep -q 'PC ASSIST' \
              && printf '%s' "$health" | grep -q '"service":"choosePC"' \
              && printf '%s' "$health" | grep -q "\"uiRevision\":\"${REQUIRED_UI_REVISION}\"" \
              && [ "$catalog_ok" -eq 1 ]; then
              echo "Cloudflare production verified: revision=${REQUIRED_UI_REVISION}, CPUs=${REQUIRED_CPU_COUNT}, GPUs=${REQUIRED_GPU_COUNT}"
              exit 0
            fi
            sleep 5
          done

          echo "Cloudflare production did not converge to revision=${REQUIRED_UI_REVISION}, CPUs=${REQUIRED_CPU_COUNT}, GPUs=${REQUIRED_GPU_COUNT}"
          exit 1
