name: sync-cloudflare-production

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [agent/bootstrap-baseline]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Move validated production branch
        run: |
          git push origin HEAD:refs/heads/cloudflare-production --force
