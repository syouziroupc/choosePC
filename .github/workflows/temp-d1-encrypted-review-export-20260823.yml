name: TEMP Encrypted D1 Review Export 20260823

on:
  push:
    paths:
      - '.github/workflows/temp-d1-encrypted-review-export-20260823.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch encrypted 100-row payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          url='https://sales-system.syouziroupc.workers.dev/__ops/review-export-6c8856c0902865c72780d3e886c5d5c2b1e7'
          req=urllib.request.Request(url,headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'choosePC-audit-bridge/1'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          assert data.get('ok') is True, data
          assert data.get('count') == 100, data.get('count')
          for k in ('wrapped_key','iv','ciphertext'):
              assert data.get(k), k
          with open('encrypted-review-export-100.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False)
          print('captured encrypted rows:',data['count'])
          PY
      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-review-export-100
          path: encrypted-review-export-100.json
          if-no-files-found: error
          retention-days: 1
