name: TEMP Encrypted D1 Review Export 20260823

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch encrypted 100-row payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          url='https://temp-d1-review-export-pr-20260823-choosepc.syouziroupc.workers.dev/__temp_sales_review_cipher_20260823'
          req=urllib.request.Request(url,headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'choosePC-audit-bridge/3'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read(); status=r.status; ctype=r.headers.get('content-type','')
          except urllib.error.HTTPError as e:
              raw=e.read(); status=e.code; ctype=e.headers.get('content-type','')
          print('HTTP',status,'content-type',ctype,'bytes',len(raw))
          data=json.loads(raw.decode('utf-8'))
          assert status == 200, (status,data)
          assert data.get('ok') is True, data
          assert data.get('count') == 100, data.get('count')
          for k in ('wrapped_key','iv','ciphertext'):
              assert data.get(k), k
          with open('encrypted-review-export-100.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False)
          print('captured encrypted rows:',data['count'])
          PY
      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-review-export-100
          path: encrypted-review-export-100.json
          if-no-files-found: error
          retention-days: 1
