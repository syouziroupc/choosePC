name: engine-health-sync

on:
  push:
    branches:
      - agent/bootstrap-baseline
    paths:
      - .engine-health-sync-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bootstrap-baseline
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Replace duplicated engine version with exported constant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/worker/src/index.ts')
          text = path.read_text(encoding='utf-8')
          old_import = '  CPU_CATALOG,\n  GPU_CATALOG,\n  USE_CASES,'
          new_import = '  CPU_CATALOG,\n  ENGINE_VERSION,\n  GPU_CATALOG,\n  USE_CASES,'
          old_health = 'if (url.pathname === "/api/v1/health") return json({ ok: true, service: "choosePC", engine: "0.2.0" });'
          new_health = 'if (url.pathname === "/api/v1/health") return json({ ok: true, service: "choosePC", engine: ENGINE_VERSION });'
          if old_import not in text:
              raise SystemExit('Expected core import block not found')
          if old_health not in text:
              raise SystemExit('Expected health version literal not found')
          text = text.replace(old_import, new_import, 1).replace(old_health, new_health, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/engine-health-sync.yml .engine-health-sync-trigger
          git add apps/worker/src/index.ts
          git commit -m "fix health engine version reporting"
          git push origin HEAD:agent/bootstrap-baseline
