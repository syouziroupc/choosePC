name: engine-health-sync

on:
  push:
    branches:
      - agent/bootstrap-baseline
    paths:
      - .engine-health-sync-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bootstrap-baseline
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Replace duplicated engine version with exported constant
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('apps/worker/src/index.ts')
          text = source.read_text(encoding='utf-8')
          old_import = '  CPU_CATALOG,\n  GPU_CATALOG,\n  USE_CASES,'
          new_import = '  CPU_CATALOG,\n  ENGINE_VERSION,\n  GPU_CATALOG,\n  USE_CASES,'
          old_health = 'if (url.pathname === "/api/v1/health") return json({ ok: true, service: "choosePC", engine: "0.2.0" });'
          new_health = 'if (url.pathname === "/api/v1/health") return json({ ok: true, service: "choosePC", engine: ENGINE_VERSION });'
          if old_import not in text:
              raise SystemExit('Expected core import block not found')
          if old_health not in text:
              raise SystemExit('Expected health version literal not found')
          source.write_text(text.replace(old_import, new_import, 1).replace(old_health, new_health, 1), encoding='utf-8')

          test = Path('apps/worker/test/api.test.ts')
          test_text = test.read_text(encoding='utf-8')
          old_test_import = 'import { describe, expect, it } from "vitest";\nimport worker from "../src/index";'
          new_test_import = 'import { describe, expect, it } from "vitest";\nimport { ENGINE_VERSION } from "../../../packages/core/src/index";\nimport worker from "../src/index";'
          old_expectation = 'expect(data.engine).toBe("0.2.0");'
          new_expectation = 'expect(data.engine).toBe(ENGINE_VERSION);'
          if old_test_import not in test_text:
              raise SystemExit('Expected API test import block not found')
          if old_expectation not in test_text:
              raise SystemExit('Expected health test version literal not found')
          test.write_text(test_text.replace(old_test_import, new_test_import, 1).replace(old_expectation, new_expectation, 1), encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/engine-health-sync.yml .engine-health-sync-trigger
          git add apps/worker/src/index.ts apps/worker/test/api.test.ts
          git commit -m "fix health engine version reporting"
          git push origin HEAD:agent/bootstrap-baseline
