name: verify-active-production

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: choosepc-active-production-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify active workers.dev from an independent runner
        shell: bash
        run: |
          set -u
          ORIGIN='https://choosepc.syouziroupc.workers.dev'
          FRONTEND='https://www.szpc.jp'
          EXPECTED_VERSION=$(node -e "const fs=require('fs');const s=fs.readFileSync('apps/worker/src/api-entry.ts','utf8');const m=s.match(/const API_VERSION = \"([^\"]+)\";/);if(!m)process.exit(2);process.stdout.write(m[1])")
          EXPECTED_CPU=$(node -e "const fs=require('fs'),p=require('path');let n=0;for(const f of fs.readdirSync('knowledge/hardware/cpu').filter(x=>x.endsWith('.json'))){const v=JSON.parse(fs.readFileSync(p.join('knowledge/hardware/cpu',f),'utf8'));n+=Array.isArray(v)?v.length:1}process.stdout.write(String(n))")
          EXPECTED_GPU=$(node -e "const fs=require('fs'),p=require('path');let n=0;for(const f of fs.readdirSync('knowledge/hardware/gpu').filter(x=>x.endsWith('.json'))){const v=JSON.parse(fs.readFileSync(p.join('knowledge/hardware/gpu',f),'utf8'));n+=Array.isArray(v)?v.length:1}process.stdout.write(String(n))")
          matched=0
          root_code=000
          meta_code=000
          health_code=000
          catalog_code=000
          for attempt in $(seq 1 48); do
            suffix="${GITHUB_SHA}-${attempt}"
            root_code=$(curl -L -sS -o /tmp/root -w '%{http_code}' --max-time 10 -H 'Cache-Control: no-cache' "${ORIGIN}/?verify=${suffix}" || echo 000)
            meta_code=$(curl -L -sS -o /tmp/meta -w '%{http_code}' --max-time 10 -H 'Cache-Control: no-cache' -H "Origin: ${FRONTEND}" "${ORIGIN}/api/v1?verify=${suffix}" || echo 000)
            health_code=$(curl -L -sS -D /tmp/health.headers -o /tmp/health -w '%{http_code}' --max-time 10 -H 'Cache-Control: no-cache' -H "Origin: ${FRONTEND}" "${ORIGIN}/api/v1/health?verify=${suffix}" || echo 000)
            catalog_code=$(curl -L -sS -o /tmp/catalog -w '%{http_code}' --max-time 10 -H 'Cache-Control: no-cache' -H "Origin: ${FRONTEND}" "${ORIGIN}/api/v1/catalog?verify=${suffix}" || echo 000)
            if [ "$root_code" = 200 ] && [ "$meta_code" = 200 ] && [ "$health_code" = 200 ] && [ "$catalog_code" = 200 ] && grep -q 'choosePC Operations' /tmp/root; then
              if EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_CPU="$EXPECTED_CPU" EXPECTED_GPU="$EXPECTED_GPU" node <<'NODE'
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('/tmp/meta','utf8'));
          const health = JSON.parse(fs.readFileSync('/tmp/health','utf8'));
          const catalog = JSON.parse(fs.readFileSync('/tmp/catalog','utf8'));
          const cpu = Array.isArray(catalog.cpus) ? catalog.cpus.length : -1;
          const gpu = Array.isArray(catalog.gpus) ? catalog.gpus.length : -1;
          if (meta.apiVersion !== process.env.EXPECTED_VERSION) process.exit(1);
          if (health.apiVersion !== process.env.EXPECTED_VERSION) process.exit(1);
          if (meta.publicUiHostedHere !== false) process.exit(1);
          if (cpu !== Number(process.env.EXPECTED_CPU)) process.exit(1);
          if (gpu !== Number(process.env.EXPECTED_GPU)) process.exit(1);
          NODE
              then
                if tr -d '\r' < /tmp/health.headers | grep -qi "^access-control-allow-origin: ${FRONTEND}$"; then
                  matched=1
                  break
                fi
              fi
            fi
            sleep 5
          done

          mkdir -p debug
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_sha=${GITHUB_SHA}"
            echo "expected_api_version=${EXPECTED_VERSION}"
            echo "expected_cpu=${EXPECTED_CPU}"
            echo "expected_gpu=${EXPECTED_GPU}"
            echo "matched=${matched}"
            echo "root_http=${root_code}"
            echo "meta_http=${meta_code}"
            echo "health_http=${health_code}"
            echo "catalog_http=${catalog_code}"
            echo '--- root ---'; head -c 2500 /tmp/root 2>/dev/null || true; echo
            echo '--- meta ---'; head -c 2500 /tmp/meta 2>/dev/null || true; echo
            echo '--- health ---'; head -c 2500 /tmp/health 2>/dev/null || true; echo
            echo '--- catalog-summary ---'
            node -e "try{const c=JSON.parse(require('fs').readFileSync('/tmp/catalog','utf8'));console.log(JSON.stringify({cpus:Array.isArray(c.cpus)?c.cpus.length:null,gpus:Array.isArray(c.gpus)?c.gpus.length:null}))}catch(e){console.log('{}')}"
          } > debug/active-production-latest.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/active-production-latest.txt
          git commit -m 'ci: record independent active production verification' || true
          git push --force origin HEAD:refs/heads/deployment-status
          test "$matched" = 1
