name: production-probe-main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: choosepc-production-probe-main
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Probe actual workers.dev
        shell: bash
        run: |
          set -u
          ORIGIN='https://choosepc.syouziroupc.workers.dev'
          EXPECTED='2026-08-18-static-frontend-v2'
          matched=0
          for attempt in $(seq 1 36); do
            root_code=$(curl -L -sS -o /tmp/root -w '%{http_code}' --max-time 10 "${ORIGIN}/?probe=${GITHUB_SHA}-${attempt}" || echo 000)
            meta_code=$(curl -L -sS -o /tmp/meta -w '%{http_code}' --max-time 10 "${ORIGIN}/api/v1?probe=${GITHUB_SHA}-${attempt}" || echo 000)
            health_code=$(curl -L -sS -o /tmp/health -w '%{http_code}' --max-time 10 "${ORIGIN}/api/v1/health?probe=${GITHUB_SHA}-${attempt}" || echo 000)
            if [ "$root_code" = 200 ] && [ "$meta_code" = 200 ] && [ "$health_code" = 200 ] \
              && grep -q 'choosePC Operations' /tmp/root \
              && grep -q "$EXPECTED" /tmp/meta \
              && grep -q "$EXPECTED" /tmp/health; then
              matched=1
              break
            fi
            sleep 5
          done
          mkdir -p debug
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_sha=${GITHUB_SHA}"
            echo "expected_api_version=${EXPECTED}"
            echo "matched=${matched}"
            echo "root_http=${root_code}"
            echo "meta_http=${meta_code}"
            echo "health_http=${health_code}"
            echo '--- root ---'
            head -c 4000 /tmp/root 2>/dev/null || true
            echo
            echo '--- meta ---'
            head -c 4000 /tmp/meta 2>/dev/null || true
            echo
            echo '--- health ---'
            head -c 4000 /tmp/health 2>/dev/null || true
            echo
          } > debug/production-probe-main.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/production-probe-main.txt
          git commit -m 'ci: record actual workers.dev probe' || true
          git push origin HEAD:main
