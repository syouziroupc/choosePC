name: visual-smoke

# The workflow name is kept for existing branch-protection compatibility.
# choosePC is now an API backend; public visual regression belongs to szpc-pages.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify API-only deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.main !== './apps/worker/src/api-entry.ts') throw new Error(`Unexpected Worker entry: ${config.main}`);
          if (Array.isArray(config.routes) && config.routes.length) throw new Error('choosePC API backend must not own www.szpc.jp routes');
          if (config.assets) throw new Error('choosePC API backend must not deploy the SZPC static UI');
          if (config.workers_dev !== true) throw new Error('workers.dev transport must remain enabled until the API host is migrated');
          NODE
      - name: Type-check API boundary
        run: npm run typecheck
      - name: Run API boundary tests
        run: npx vitest run --config vitest.config.ts apps/worker/test/api-entry.test.ts
      - name: Wrangler API deployment dry-run
        run: npx wrangler deploy --dry-run
