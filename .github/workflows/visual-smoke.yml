name: visual-smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Install Japanese font for deterministic screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Start local Worker + Vite app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/choosepc-vite.log 2>&1 &
          echo $! > /tmp/choosepc-vite.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/choosepc-vite.log
          exit 1
      - name: Capture desktop and mobile renders
        run: |
          mkdir -p visual-artifacts
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable on runner"
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1600 --screenshot="$PWD/visual-artifacts/home-desktop.png" http://127.0.0.1:5173/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1200 --screenshot="$PWD/visual-artifacts/home-mobile.png" http://127.0.0.1:5173/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,4200 --screenshot="$PWD/visual-artifacts/full-desktop.png" http://127.0.0.1:5173/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,4600 --screenshot="$PWD/visual-artifacts/full-mobile.png" http://127.0.0.1:5173/
          test -s visual-artifacts/home-desktop.png
          test -s visual-artifacts/home-mobile.png
          test -s visual-artifacts/full-desktop.png
          test -s visual-artifacts/full-mobile.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-${{ github.sha }}
          path: visual-artifacts/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Show Vite log on failure
        if: failure()
        run: cat /tmp/choosepc-vite.log || true
