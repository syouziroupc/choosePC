name: visual-smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Japanese font for deterministic screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Start local Worker + Vite app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/choosepc-vite.log 2>&1 &
          echo $! > /tmp/choosepc-vite.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/choosepc-vite.log
          exit 1
      - name: Capture initial wide, desktop and mobile renders
        run: |
          mkdir -p visual-artifacts
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable on runner"
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1920,1600 --screenshot="$PWD/visual-artifacts/home-wide-1920.png" http://127.0.0.1:5173/pc-check/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1600 --screenshot="$PWD/visual-artifacts/home-desktop.png" http://127.0.0.1:5173/pc-check/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,1200 --screenshot="$PWD/visual-artifacts/home-mobile.png" http://127.0.0.1:5173/pc-check/
          "$CHROME" --headless --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:5173/pc-check/ > /tmp/choosepc-home-dom.html
          test -s visual-artifacts/home-wide-1920.png
          test -s visual-artifacts/home-desktop.png
          test -s visual-artifacts/home-mobile.png
          grep -q "スペックから" /tmp/choosepc-home-dom.html
      - name: Exercise purchase result and offer recommendation states
        env:
          VISUAL_BASE_URL: http://127.0.0.1:5173/pc-check/
          VISUAL_OUTPUT_DIR: visual-artifacts
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable on runner"
            exit 1
          fi
          node scripts/capture_visual_states.mjs
          test -s visual-artifacts/purchase-empty-desktop.png
          test -s visual-artifacts/purchase-empty-mobile.png
          test -s visual-artifacts/purchase-offers-desktop.png
          test -s visual-artifacts/purchase-offers-mobile.png
      - name: Exercise GPU catalog suggestion states
        env:
          VISUAL_BASE_URL: http://127.0.0.1:5173/pc-check/
          VISUAL_OUTPUT_DIR: visual-artifacts
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable on runner"
            exit 1
          fi
          node scripts/capture_catalog_suggest.mjs
          test -s visual-artifacts/suggest-gtx680-desktop.png
          test -s visual-artifacts/suggest-gtx680-mobile.png
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-${{ github.sha }}
          path: visual-artifacts/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Show Vite log on failure
        if: failure()
        run: cat /tmp/choosepc-vite.log || true
