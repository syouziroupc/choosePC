name: Test Cloudflare bootstrap

on:
  push:
    branches: [main]
    paths:
      - deploy-bootstrap/**
      - .github/workflows/test-cloudflare-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Execute same bootstrap path as Cloudflare
        working-directory: deploy-bootstrap
        env:
          WRANGLER_DRY_RUN: "1"
        run: npm run deploy
