name: production-probe-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Capture live Worker response
        shell: bash
        run: |
          set -u
          ORIGIN='https://choosepc.syouziroupc.workers.dev'
          mkdir -p debug
          root_code=$(curl -L -sS -o /tmp/root -w '%{http_code}' --max-time 15 "${ORIGIN}/?capture=${GITHUB_SHA}" || echo 000)
          meta_code=$(curl -L -sS -o /tmp/meta -w '%{http_code}' --max-time 15 "${ORIGIN}/api/v1?capture=${GITHUB_SHA}" || echo 000)
          health_code=$(curl -L -sS -o /tmp/health -w '%{http_code}' --max-time 15 "${ORIGIN}/api/v1/health?capture=${GITHUB_SHA}" || echo 000)
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_sha=${GITHUB_SHA}"
            echo "root_http=${root_code}"
            echo "meta_http=${meta_code}"
            echo "health_http=${health_code}"
            echo '--- root ---'; head -c 5000 /tmp/root 2>/dev/null || true; echo
            echo '--- meta ---'; head -c 5000 /tmp/meta 2>/dev/null || true; echo
            echo '--- health ---'; head -c 5000 /tmp/health 2>/dev/null || true; echo
          } > debug/production-probe-once.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/production-probe-once.txt
          git commit -m 'ci: capture live workers.dev response' || true
          git push origin HEAD:main
