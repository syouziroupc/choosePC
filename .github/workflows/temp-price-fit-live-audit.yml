name: temp-price-fit-live-audit

on:
  pull_request:
    paths:
      - .github/workflows/temp-price-fit-live-audit.yml

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://www.szpc.jp
      OPS: https://choosepc.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v6

      - name: Install browser tooling and Japanese fonts
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Wait for Worker v9 and site UI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "${OPS}/api/v1" -o /tmp/api.json || true
            curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "${SITE}/pc-check/?audit=${GITHUB_SHA}" -o /tmp/page.html || true
            if grep -q '2026-08-24-price-fit-v9' /tmp/api.json 2>/dev/null \
              && grep -q 'id="price-axis"' /tmp/page.html 2>/dev/null \
              && grep -q 'id="fit-axis"' /tmp/page.html 2>/dev/null \
              && grep -q 'id="weakness-list"' /tmp/page.html 2>/dev/null; then
              echo "Worker v9 and price-fit UI are live on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo '--- API ---'; cat /tmp/api.json || true
          echo '--- PAGE ---'; head -80 /tmp/page.html || true
          exit 1

      - name: Verify SEO surface was not changed by this runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<title>パソコン購入判定｜このPC、買って大丈夫？｜正二郎商事</title>' /tmp/page.html
          grep -q '<meta name="robots" content="index,follow">' /tmp/page.html
          grep -q '<link rel="canonical" href="https://www.szpc.jp/pc-check/">' /tmp/page.html

      - name: Verify two-axis API and weakness contract through szpc relay
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/evaluate.json <<'JSON'
          {
            "pc": {
              "category": "general_laptop",
              "cpu": {"raw": "Intel Core i5-1235U", "confidence": 95},
              "gpu": {"raw": "Intel Iris Xe Graphics", "variant": "integrated", "confidence": 95},
              "memory": {"sizeGb": 4, "upgradeable": null},
              "storage": [{"kind": "unknown", "sizeGb": 512}],
              "display": {"refreshHz": 60},
              "mobility": {"weightKg": 1.2},
              "condition": {"type": "used", "grade": "unknown", "batteryHealthPct": 85, "defects": []},
              "commerce": {"priceJpy": 45000, "warrantyDays": 90, "sourceUrl": null},
              "confidence": {},
              "extra": {"coolingScore": null, "upgradeabilityScore": null}
            },
            "useCase": "office"
          }
          JSON
          code="$(curl --silent --show-error --max-time 20 -D /tmp/evaluate.headers -o /tmp/evaluate.out -w '%{http_code}' \
            -H 'Cache-Control: no-cache' -H 'Content-Type: application/json' \
            -H 'X-ChoosePC-Client: 123e4567-e89b-42d3-a456-426614174001' \
            --data-binary @/tmp/evaluate.json "${SITE}/api/choosepc/v1/evaluate")"
          test "$code" = "200"
          grep -qi '^x-szpc-api-proxy: choosepc-public-v1' /tmp/evaluate.headers
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/evaluate.out', 'utf8'));
          const a = body?.result?.purchaseAssessment;
          if (!a?.price || !a?.performanceFit || !Array.isArray(a?.weaknesses)) process.exit(1);
          if (typeof a.performanceFit.score !== 'number') process.exit(1);
          if (!a.weaknesses.some(x => x.metric === 'ramGb' && x.label === 'メモリ容量')) process.exit(1);
          if (!['good','fair','high','unknown'].includes(a.price.verdict)) process.exit(1);
          if (!['sufficient','borderline','insufficient','unknown'].includes(a.performanceFit.verdict)) process.exit(1);
          console.log(JSON.stringify({decision: body.result.decision, purchaseAssessment: a}, null, 2));
          NODE

      - name: Capture desktop and mobile user flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-artifacts
          node <<'NODE'
          (async () => {
            const { chromium } = require('playwright');
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            let executablePath = '';
            for (const candidate of ['google-chrome', 'chromium', 'chromium-browser']) {
              try { executablePath = execFileSync('which', [candidate], { encoding: 'utf8' }).trim(); } catch {}
              if (executablePath) break;
            }
            if (!executablePath) throw new Error('Chrome/Chromium not found');
            const browser = await chromium.launch({ headless: true, executablePath });
            for (const vp of [{ name: 'desktop', width: 1440, height: 1100 }, { name: 'mobile', width: 390, height: 844 }]) {
              const context = await browser.newContext({ viewport: { width: vp.width, height: vp.height }, reducedMotion: 'reduce' });
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
              page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
              const response = await page.goto(`${process.env.SITE}/pc-check/?audit=${process.env.GITHUB_SHA}`, { waitUntil: 'networkidle', timeout: 45000 });
              if (!response?.ok()) throw new Error(`${vp.name}: HTTP ${response?.status()}`);
              const initial = await page.evaluate(() => ({ width: document.documentElement.clientWidth, scrollWidth: document.documentElement.scrollWidth }));
              if (initial.scrollWidth > initial.width + 2) throw new Error(`${vp.name}: initial overflow`);
              await page.screenshot({ path: `visual-artifacts/${vp.name}-initial.png`, fullPage: true, animations: 'disabled' });
              await page.click('#manual-open');
              await page.fill('#cpu', 'Intel Core i5-1235U');
              await page.fill('#gpu', 'Intel Iris Xe Graphics');
              await page.fill('#ram', '4');
              await page.fill('#storage', '512');
              await page.fill('#price', '45000');
              await page.selectOption('#condition', 'used');
              await page.click('#evaluate-submit');
              await page.waitForSelector('#result-section:not([hidden])', { timeout: 30000 });
              const visible = await page.evaluate(() => ({
                text: document.querySelector('#result-section')?.innerText || '',
                width: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
              }));
              for (const required of ['価格', '性能適合性', '弱いところ', 'メモリ容量']) {
                if (!visible.text.includes(required)) throw new Error(`${vp.name}: missing ${required}`);
              }
              for (const forbidden of ['総合評価', '評価の内訳', '中古状態', '今後も使えるか']) {
                if (visible.text.includes(forbidden)) throw new Error(`${vp.name}: legacy result leaked ${forbidden}`);
              }
              if (visible.scrollWidth > visible.width + 2) throw new Error(`${vp.name}: result overflow`);
              if (errors.length) throw new Error(`${vp.name}: ${errors.join(' | ')}`);
              await page.screenshot({ path: `visual-artifacts/${vp.name}-result.png`, fullPage: true, animations: 'disabled' });
              await context.close();
            }
            await browser.close();
            if (fs.readdirSync('visual-artifacts').filter(x => x.endsWith('.png')).length !== 4) throw new Error('Expected four screenshots');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-fit-live-audit-${{ github.sha }}
          path: |
            visual-artifacts/*.png
            /tmp/api.json
            /tmp/page.html
            /tmp/evaluate.headers
            /tmp/evaluate.out
          if-no-files-found: warn
          retention-days: 7
