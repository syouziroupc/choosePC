name: production-smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BASE_URL: https://choosepc.syouziroupc.workers.dev
    steps:
      - name: Inspect production route
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HOME HEADERS ==='
          curl --silent --show-error --location --max-time 15 -D - -o /tmp/home.html -H 'Cache-Control: no-cache' "$BASE_URL/?diagnostic=${GITHUB_SHA}" || true
          echo '=== HOME BODY ==='
          head -c 3000 /tmp/home.html || true
          echo
          echo '=== HEALTH HEADERS ==='
          curl --silent --show-error --location --max-time 15 -D - -o /tmp/health.txt -H 'Cache-Control: no-cache' "$BASE_URL/api/v1/health?diagnostic=${GITHUB_SHA}" || true
          echo '=== HEALTH BODY ==='
          head -c 3000 /tmp/health.txt || true
          echo

      - name: Verify current choosePC production
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PC ASSIST' /tmp/home.html
          grep -q '"service":"choosePC"' /tmp/health.txt
