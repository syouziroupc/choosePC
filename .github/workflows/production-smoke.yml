name: production-smoke

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choosepc-production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      API_ORIGIN: https://choosepc.syouziroupc.workers.dev
      FRONTEND_ORIGIN: https://www.szpc.jp
      REQUIRED_API_VERSION: 2026-08-18-static-frontend-v3
    steps:
      - uses: actions/checkout@v6
      - name: Verify actual workers.dev deployment
        shell: bash
        run: |
          set -u
          for attempt in $(seq 1 30); do
            root_code=$(curl -L -sS -o /tmp/root -w '%{http_code}' --max-time 10 "${API_ORIGIN}/?smoke=${GITHUB_SHA}-${attempt}" || echo 000)
            meta_code=$(curl -L -sS -o /tmp/meta -w '%{http_code}' --max-time 10 -H "Origin: ${FRONTEND_ORIGIN}" "${API_ORIGIN}/api/v1?smoke=${GITHUB_SHA}-${attempt}" || echo 000)
            health_code=$(curl -L -sS -o /tmp/health -w '%{http_code}' --max-time 10 -H "Origin: ${FRONTEND_ORIGIN}" "${API_ORIGIN}/api/v1/health?smoke=${GITHUB_SHA}-${attempt}" || echo 000)
            echo "attempt=${attempt} root=${root_code} meta=${meta_code} health=${health_code}"
            if [ "$root_code" = 200 ] && [ "$meta_code" = 200 ] && [ "$health_code" = 200 ] \
              && grep -q 'choosePC Operations' /tmp/root \
              && grep -q "$REQUIRED_API_VERSION" /tmp/meta \
              && grep -q "$REQUIRED_API_VERSION" /tmp/health; then
              echo 'LIVE_PRODUCTION_MATCHED=true'
              echo '--- meta ---'; cat /tmp/meta
              echo '--- health ---'; cat /tmp/health
              exit 0
            fi
            sleep 5
          done
          echo 'LIVE_PRODUCTION_MATCHED=false'
          echo '--- root ---'; head -c 5000 /tmp/root || true; echo
          echo '--- meta ---'; cat /tmp/meta || true; echo
          echo '--- health ---'; cat /tmp/health || true; echo
          exit 1
