name: production-smoke

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choosepc-production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_ORIGIN: https://choosepc.syouziroupc.workers.dev
      FRONTEND_ORIGIN: https://www.szpc.jp
    steps:
      - uses: actions/checkout@v6

      - name: Resolve expected API markers
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const source = fs.readFileSync('apps/worker/src/api-entry.ts', 'utf8');
          const apiVersion = source.match(/const API_VERSION = "([^"]+)";/)?.[1];
          if (!apiVersion) throw new Error('API_VERSION was not found');
          function countJsonEntries(dir) {
            return fs.readdirSync(dir)
              .filter((name) => name.endsWith('.json'))
              .reduce((sum, name) => {
                const value = JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
                return sum + (Array.isArray(value) ? value.length : 1);
              }, 0);
          }
          const cpuCount = countJsonEntries('knowledge/hardware/cpu');
          const gpuCount = countJsonEntries('knowledge/hardware/gpu');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `api_version=${apiVersion}\ncpu_count=${cpuCount}\ngpu_count=${gpuCount}\n`);
          NODE

      - name: Wait for exact choosePC operations/API deployment
        shell: bash
        env:
          REQUIRED_API_VERSION: ${{ steps.expected.outputs.api_version }}
          REQUIRED_CPU_COUNT: ${{ steps.expected.outputs.cpu_count }}
          REQUIRED_GPU_COUNT: ${{ steps.expected.outputs.gpu_count }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            rm -f /tmp/ops.html /tmp/meta.json /tmp/health.json /tmp/catalog.json /tmp/health.headers
            curl --fail --silent --show-error --location --max-time 10 -H 'Cache-Control: no-cache' \
              "${API_ORIGIN}/?smoke=${GITHUB_SHA}" -o /tmp/ops.html || true
            curl --fail --silent --show-error --location --max-time 10 \
              -H 'Cache-Control: no-cache' -H "Origin: ${FRONTEND_ORIGIN}" \
              "${API_ORIGIN}/api/v1?smoke=${GITHUB_SHA}" -o /tmp/meta.json || true
            curl --fail --silent --show-error --location --max-time 10 \
              -D /tmp/health.headers -H 'Cache-Control: no-cache' -H "Origin: ${FRONTEND_ORIGIN}" \
              "${API_ORIGIN}/api/v1/health?smoke=${GITHUB_SHA}" -o /tmp/health.json || true
            curl --fail --silent --show-error --location --max-time 10 \
              -H 'Cache-Control: no-cache' -H "Origin: ${FRONTEND_ORIGIN}" \
              "${API_ORIGIN}/api/v1/catalog?smoke=${GITHUB_SHA}" -o /tmp/catalog.json || true

            if [ -s /tmp/ops.html ] && [ -s /tmp/meta.json ] && [ -s /tmp/health.json ] && [ -s /tmp/catalog.json ] && [ -s /tmp/health.headers ]; then
              if grep -q 'choosePC Operations' /tmp/ops.html \
                && grep -q 'API利用状況' /tmp/ops.html \
                && REQUIRED_API_VERSION="$REQUIRED_API_VERSION" REQUIRED_CPU_COUNT="$REQUIRED_CPU_COUNT" REQUIRED_GPU_COUNT="$REQUIRED_GPU_COUNT" node <<'NODE'
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('/tmp/meta.json', 'utf8'));
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const catalog = JSON.parse(fs.readFileSync('/tmp/catalog.json', 'utf8'));
          const cpu = Array.isArray(catalog.cpus) ? catalog.cpus.length : -1;
          const gpu = Array.isArray(catalog.gpus) ? catalog.gpus.length : -1;
          if (meta.service !== 'choosePC' || meta.mode !== 'api' || meta.publicUiHostedHere !== false) process.exit(1);
          if (typeof meta.operationsConsole !== 'string' || !meta.operationsConsole.endsWith('/')) process.exit(1);
          if (meta.apiVersion !== process.env.REQUIRED_API_VERSION) process.exit(1);
          if (health.ok !== true || health.service !== 'choosePC' || health.mode !== 'api') process.exit(1);
          if (health.apiVersion !== process.env.REQUIRED_API_VERSION) process.exit(1);
          if (cpu !== Number(process.env.REQUIRED_CPU_COUNT) || gpu !== Number(process.env.REQUIRED_GPU_COUNT)) process.exit(1);
          NODE
              then
                if tr -d '\r' < /tmp/health.headers | grep -qi "^access-control-allow-origin: ${FRONTEND_ORIGIN}$"; then
                  echo "choosePC operations/API verified on attempt ${attempt}: version=${REQUIRED_API_VERSION}, CPUs=${REQUIRED_CPU_COUNT}, GPUs=${REQUIRED_GPU_COUNT}"
                  exit 0
                fi
              fi
            fi
            sleep 5
          done

          echo "choosePC operations/API did not converge at ${API_ORIGIN}"
          exit 1
