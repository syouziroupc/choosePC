name: production-smoke

on:
  push:
    branches:
      - cloudflare-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choosepc-production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      UI_URL: https://www.szpc.jp/pc-check/
      HEALTH_URL: https://www.szpc.jp/api/v1/health
      CATALOG_URL: https://www.szpc.jp/api/v1/catalog
    steps:
      - uses: actions/checkout@v6

      - name: Resolve expected production markers
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const source = fs.readFileSync('apps/worker/src/browser-enhanced-entry.ts', 'utf8');
          const revision = source.match(/export const UI_REVISION = "([^"]+)";/)?.[1];
          if (!revision) throw new Error('UI_REVISION was not found');

          function countJsonEntries(dir) {
            return fs.readdirSync(dir)
              .filter((name) => name.endsWith('.json'))
              .reduce((sum, name) => {
                const value = JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
                return sum + (Array.isArray(value) ? value.length : 1);
              }, 0);
          }

          const cpuCount = countJsonEntries('knowledge/hardware/cpu');
          const gpuCount = countJsonEntries('knowledge/hardware/gpu');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ui_revision=${revision}\ncpu_count=${cpuCount}\ngpu_count=${gpuCount}\n`);
          console.log(`Expected production: revision=${revision}, CPUs=${cpuCount}, GPUs=${gpuCount}`);
          NODE

      - name: Wait for exact choosePC production revision
        shell: bash
        env:
          REQUIRED_UI_REVISION: ${{ steps.expected.outputs.ui_revision }}
          REQUIRED_CPU_COUNT: ${{ steps.expected.outputs.cpu_count }}
          REQUIRED_GPU_COUNT: ${{ steps.expected.outputs.gpu_count }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            html="$(curl --fail --silent --show-error --location --max-time 10 -H 'Cache-Control: no-cache' "${UI_URL}?smoke=${GITHUB_SHA}" || true)"
            health="$(curl --fail --silent --show-error --location --max-time 10 -H 'Cache-Control: no-cache' "${HEALTH_URL}?smoke=${GITHUB_SHA}" || true)"
            catalog="$(curl --fail --silent --show-error --location --max-time 10 -H 'Cache-Control: no-cache' "${CATALOG_URL}?smoke=${GITHUB_SHA}" || true)"

            catalog_ok=0
            if [ -n "$catalog" ]; then
              printf '%s' "$catalog" > /tmp/catalog.json
              if REQUIRED_CPU_COUNT="$REQUIRED_CPU_COUNT" REQUIRED_GPU_COUNT="$REQUIRED_GPU_COUNT" node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/catalog.json', 'utf8'));
          const cpu = Array.isArray(data.cpus) ? data.cpus.length : -1;
          const gpu = Array.isArray(data.gpus) ? data.gpus.length : -1;
          const expectedCpu = Number(process.env.REQUIRED_CPU_COUNT);
          const expectedGpu = Number(process.env.REQUIRED_GPU_COUNT);
          if (cpu !== expectedCpu || gpu !== expectedGpu) {
            console.error(`Catalog mismatch: deployed CPUs=${cpu}, GPUs=${gpu}; expected CPUs=${expectedCpu}, GPUs=${expectedGpu}`);
            process.exit(1);
          }
          NODE
              then
                catalog_ok=1
              fi
            fi

            if printf '%s' "$html" | grep -q 'このパソコン、買って大丈夫？' \
              && printf '%s' "$html" | grep -q 'PC ASSIST' \
              && printf '%s' "$health" | grep -q '"service":"choosePC"' \
              && printf '%s' "$health" | grep -q "\"uiRevision\":\"${REQUIRED_UI_REVISION}\"" \
              && [ "$catalog_ok" -eq 1 ]; then
              printf 'Production route verified on attempt %s.\n' "$attempt"
              printf 'UI_URL=%s\n' "$UI_URL"
              printf 'HEALTH=%s\n' "$health"
              printf 'CATALOG=CPUs:%s GPUs:%s\n' "$REQUIRED_CPU_COUNT" "$REQUIRED_GPU_COUNT"
              exit 0
            fi
            sleep 5
          done

          printf 'Production did not converge to revision %s with CPUs=%s GPUs=%s.\n' \
            "$REQUIRED_UI_REVISION" "$REQUIRED_CPU_COUNT" "$REQUIRED_GPU_COUNT"
          exit 1
