name: production-smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://choosepc.syouziroupc.workers.dev
    steps:
      - name: Wait for choosePC production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            html="$(curl --fail --silent --show-error --location --max-time 10 -H 'Cache-Control: no-cache' "$BASE_URL/?smoke=${GITHUB_SHA}" || true)"
            health="$(curl --fail --silent --show-error --location --max-time 10 -H 'Cache-Control: no-cache' "$BASE_URL/api/v1/health?smoke=${GITHUB_SHA}" || true)"
            if printf '%s' "$html" | grep -q 'このパソコン、買って大丈夫？' \
              && printf '%s' "$html" | grep -q 'PC ASSIST' \
              && printf '%s' "$health" | grep -q '"service":"choosePC"'; then
              printf 'Production route verified on attempt %s.\n' "$attempt"
              printf 'HEALTH=%s\n' "$health"
              exit 0
            fi
            sleep 5
          done
          echo 'Production route did not serve the concrete PC ASSIST diagnostic UI within the verification window.'
          exit 1
