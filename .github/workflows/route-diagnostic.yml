name: route-diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect live routes
        shell: bash
        run: |
          set +e
          for BASE in 'https://choosepc.szpc.jp' 'https://choosepc.syouziroupc.workers.dev'; do
            echo "=== $BASE HEALTH ==="
            curl -i -sS -L --max-time 15 -H 'Cache-Control: no-cache' "$BASE/api/v1/health?sha=${GITHUB_SHA}"
            echo
            echo "=== $BASE HOME ==="
            curl -i -sS -L --max-time 15 -H 'Cache-Control: no-cache' "$BASE/?sha=${GITHUB_SHA}" | head -c 5000
            echo
          done
          exit 0
