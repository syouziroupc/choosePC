name: cloudflare-dependency-security-update

on:
  push:
    branches:
      - agent/bootstrap-baseline
    paths:
      - .cloudflare-dependency-security-update-trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bootstrap-baseline
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Resolve current Cloudflare toolchain releases
        run: |
          echo "wrangler=$(npm view wrangler version)"
          echo "vite-plugin=$(npm view @cloudflare/vite-plugin version)"
          echo "workers-types=$(npm view @cloudflare/workers-types version)"
      - name: Update vulnerable Cloudflare development toolchain
        run: npm install --save-dev --save-exact wrangler@latest @cloudflare/vite-plugin@latest @cloudflare/workers-types@latest
      - name: Verify dependency security
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - run: npm run validate:knowledge
      - run: python3 scripts/validate_migrations.py
      - run: python3 scripts/validate_knowledge_seed.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run
      - name: Commit security update and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cloudflare-dependency-security-update.yml .cloudflare-dependency-security-update-trigger
          git add package.json package-lock.json
          git commit -m "chore: update Cloudflare toolchain for undici security fixes"
          git push origin HEAD:agent/bootstrap-baseline
