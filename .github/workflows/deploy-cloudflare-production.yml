name: Deploy choosePC main branch

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: choosepc-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run validate:knowledge
          npm run typecheck
          npm test

      - name: Build Cloudflare Vite output
        run: npm run build

      - name: Verify generated deployment files
        run: |
          test -f dist/client/index.html
          test -f dist/choosepc/wrangler.json

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
