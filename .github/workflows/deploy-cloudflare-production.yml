name: Deploy choosePC manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choosepc-direct-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            exit 2
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"
            exit 2
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation
        run: npm run check

      - name: Verify API-only deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.main !== './apps/worker/src/api-entry.ts') throw new Error(`Unexpected Worker entry: ${config.main}`);
          if (Array.isArray(config.routes) && config.routes.length) throw new Error('choosePC API backend must not own www.szpc.jp routes');
          if (config.assets) throw new Error('choosePC API backend must not deploy SZPC static assets');
          NODE

      - name: Wrangler deployment dry-run
        run: npx wrangler deploy --dry-run

      - name: Deploy exact validated API backend
        run: npx wrangler deploy --strict
