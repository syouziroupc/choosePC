name: Deploy choosePC manually

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            exit 2
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"
            exit 2
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run validate:knowledge
          npm run typecheck
          npm test

      - name: Build Cloudflare Vite output
        run: npm run build

      - name: Verify generated deployment files
        run: |
          test -f dist/client/index.html
          test -f dist/choosepc/wrangler.json

      - name: Deploy
        run: npx wrangler deploy
