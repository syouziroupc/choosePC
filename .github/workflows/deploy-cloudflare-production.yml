name: Deploy choosePC manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choosepc-direct-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN"
            exit 2
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"
            exit 2
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation
        run: npm run check

      - name: Verify generated deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          test -f dist/choosepc/wrangler.json

      - name: Wrangler deployment dry-run
        run: npx wrangler deploy --dry-run

      - name: Deploy exact validated build
        run: npx wrangler deploy --strict
