name: talksys-deploy-bridge

on:
  push:
    branches: [talksys-deploy-bridge]

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 2; }

      - name: Fetch TalkSys main
        shell: bash
        run: git clone --depth 1 --branch main https://github.com/syouziroupc/talksys.git talksys

      - name: Install and test TalkSys
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          node --check src/index.js
          npx wrangler deploy --dry-run

      - name: Deploy TalkSys to Cloudflare
        id: deploy
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --strict 2>&1 | tee /tmp/talksys-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/talksys-deploy.log | tail -1 | sed 's/[[:punct:]]$//' || true)"
          if [ -z "$WORKER_URL" ]; then
            echo 'Could not determine workers.dev URL'
            cat /tmp/talksys-deploy.log
            exit 3
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "TalkSys deployed: $WORKER_URL"

      - name: Verify live health and AI chat
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error "$WORKER_URL/health" -o /tmp/health.json; then break; fi
            sleep 5
          done
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));if(x.ok!==true||x.screenCapture!==true||x.overlay!==true)process.exit(1)'
          curl --fail --silent --show-error -X POST "$WORKER_URL/api/chat" -H 'content-type: application/json' --data '{"messages":[{"role":"user","content":"1+1を数字だけで答えて"}]}' -o /tmp/chat.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/chat.json","utf8"));if(typeof x.reply!=="string"||!x.reply.trim())process.exit(1);console.log("AI chat OK:",x.reply)'

      - name: Verify live vision endpoint
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const image='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQmcAAAAASUVORK5CYII=';
          fs.writeFileSync('/tmp/locate-body.json',JSON.stringify({query:'画面中央を指して',image}));
          NODE
          code="$(curl --silent --show-error -o /tmp/locate.json -w '%{http_code}' -X POST "$WORKER_URL/api/locate" -H 'content-type: application/json' --data-binary @/tmp/locate-body.json)"
          cat /tmp/locate.json
          if [ "$code" != "200" ]; then
            echo "Vision endpoint failed with HTTP $code"
            exit 4
          fi
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/locate.json","utf8"));if(typeof x.found!=="boolean")process.exit(1);console.log("Vision endpoint OK")'
